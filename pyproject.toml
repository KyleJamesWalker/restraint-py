[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "restraint"
version = "0.1.0"
description = "Composable rate limiting, quota protection, and polite-client restraints"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kyle James Walker", email = "KyleJamesWalker@gmail.com" }]
keywords = ["rate-limit", "throttle", "quota", "backoff", "token-bucket", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-cov>=6",
    "pytest-mock>=3.14",
]
dev = ["restraint[test]", "mypy>=1.14", "ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/KyleJamesWalker/restraint-py"
Source = "https://github.com/KyleJamesWalker/restraint-py"
Issues = "https://github.com/KyleJamesWalker/restraint-py/issues"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["restraint"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.mypy]
python_version = "3.11"
packages = ["restraint"]
strict = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ASYNC",# flake8-async
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "S101"]
