name: Release

on:
  push:
    # Glob, not regex: [0-9] is one digit, + is one-or-more of it. A numeric
    # core is required so a tag like `v-rollback` or `nightly` never reaches
    # PyPI; the release-shaped suffix (rc1, .post1, .dev1) is validated below.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Verify the tag is a release version
        run: |
          # PEP 440, which is what PyPI accepts -- not semver. Anchored, so a
          # numeric-looking tag that slipped past the trigger stops here.
          pattern='^v[0-9]+(\.[0-9]+){2,3}(([ab]|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'
          if ! [[ "$GITHUB_REF_NAME" =~ $pattern ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not a release version; refusing to publish"
            exit 1
          fi

      - name: Require CI to have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | first | .conclusion // "missing"')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on ${sha} is '${conclusion}'; refusing to publish"
            exit 1
          fi

      - name: Verify tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(uv version --short)"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag $tag does not match project version $project"
            exit 1
          fi
      - run: uv build
      - run: uv run --with twine twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/restraint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
